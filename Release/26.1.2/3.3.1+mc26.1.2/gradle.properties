org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

minecraft_version=26.1.2
loader_version=0.19.3
fabric_version=0.155.2+26.1.2

# Scheme: SemVer (MAJOR.MINOR.PATCH) + "+mc<minecraft>" build metadata.
# 2.3.1 -> 2.3.2 = bugfix/hardening only, no new features, no breaking change.
# 2.5.1 -> 2.6.0 = MINOR: automatic restock is a new feature (the scheduled timer now performs the
#   restock itself, free, instead of only raising a hint), and live restock countdowns are new.
#   The bug fixes shipped with it - the "Ready." strip covering the Trade/Sell tabs, and Buy
#   staying live during a restock - would only have been a PATCH on their own, but a new feature
#   outranks a bug fix. Nothing breaks: old shop saves load unchanged.
# 2.6.0 -> 2.7.0 = MINOR. Three new features: a manual restock now starts immediately and the
#   4 iron became an optional "finish it now" shortcut instead of a requirement; the central item
#   area is replaced by a large live countdown while a category refills; and all shop state is
#   broadcast, so a restock one player triggers is visible to everyone with the shop open. The
#   animation performance work is an optimisation, not a feature, and would have been a PATCH on
#   its own - but a feature outranks it. Nothing breaks: 2.5.x/2.6.x shop saves load unchanged
#   (the retired armed/due flags are ignored on load).
# 2.7.0 -> 2.8.0 = MINOR. One new feature: with "Cinematic Respawn" (mod id cinematic_respawn,
#   client-only) installed, death switches the camera to third person back and the first movement
#   after respawning restores the player's own view. Auto-detected, no setting, and completely
#   absent when that mod is not installed. Shipped alongside it is the real fix for the frame drop
#   when the shop menu opens - the 15 GUI textures are now warmed a tick at a time instead of being
#   read, decoded and uploaded inside the frame that opens the screen - which would have been a
#   PATCH on its own. Nothing breaks: saves and packets are unchanged from 2.7.0.
# 2.8.0 -> 2.9.0 = MINOR. The GUI textures are now loaded by the shop screen itself, in one pass,
#   in init() - the 15-tick background warm-up added in 2.8.0 is deleted outright, along with the
#   crash window it opened when the menu was opened while it was still running. That much is a
#   PATCH; the reason this is a MINOR is the balance pass shipped with it, which changes how the
#   mod plays: Charge-and-Slam now takes 38 ticks (1.9s) to reach full power instead of 30 (1.5s),
#   and a restock takes 75 seconds instead of 45 when the optional 4 iron is not paid, so the iron
#   shortcut is worth something again. Memory work rides along - EnumMap/array-backed shop tables,
#   an allocation-free restock roll, and one shared sync row list per state change instead of one
#   per player per second - which would have been a PATCH on its own.
#   Nothing breaks: 2.7.x/2.8.x saves and packets load unchanged. A save mid-restock is clamped to
#   the new 75s ceiling exactly as it always was.
# 2.9.0 -> 2.9.1 = PATCH. Restock duration only: 75 -> 300 seconds (5 minutes) when the optional
#   4 iron is not paid. 2.9.0's 75s was still short enough that waiting was never worse than paying,
#   which made the iron shortcut - and therefore the whole restock mechanic - pointless; buying is
#   locked for the entire refill, so "no iron" now genuinely means that category is shut for five
#   real minutes. This is a corrected value, not a new feature: no new behaviour, no new packet, no
#   new state, and the only other edit is the wording that reads it ("5m" instead of "300s" in chat
#   and in the Help tab). Everything else in 2.9.0 - the GUI preload, the 38-tick slam, the memory
#   work - is untouched. Nothing breaks: 2.7.x-2.9.0 saves load unchanged, and a save caught
#   mid-restock is clamped to the new ceiling exactly as it always was.
# 2.9.1 -> 2.9.2 = PATCH. Balance follow-up to 2.9.1, values only. 2.9.1 raised the refill to 300s
#   but left the automatic schedule at its old 120-300s, so an unfed category was CLOSED longer than
#   it was open - open:closed ran 0.40:1 to 1.00:1, averaging 0.70:1, i.e. only ~41% of the cycle
#   buyable. AUTO_RESTOCK_MIN_SECONDS 120 -> 300 (SPREAD stays 180, so categories still drift apart)
#   makes the open stretch 300-480s against the same 300s refill: open:closed 1.00:1 worst,
#   1.30:1 average, 1.60:1 best - open is never the shorter half again. RESTOCK_DELAY_SECONDS is
#   deliberately untouched at 300, and the optional 4-iron shortcut is untouched. No new feature, no
#   new packet, no new state, no new field: the Help tab already builds its "AUTO - every X-Ymin"
#   line from these two constants and now reads 5-8min by itself. Nothing breaks: 2.7.x-2.9.1 saves
#   load unchanged, and a save carrying a nextAutoRestockSeconds from the old 120-300 range simply
#   finishes that shorter cycle once and re-rolls into the new range.
# 2.9.2 -> 3.0.0 = MAJOR, and the MAJOR is bought by exactly one of the three changes below.
#   [MAJOR] The shop save MOVED. It was config/merchantmind_shop.json - one file belonging to the
#     game installation, which every world in that installation opened, wrote to and overwrote, so
#     stock, prices, both restock clocks and every player's coin balance were shared across worlds
#     and deleting one world corrupted the rest. It is now <save>/data/merchantmind_shop.json:
#     per-world, and copied/renamed/deleted with the world like the world data it always was. The
#     old shared file is adopted by the FIRST world opened after the update and then renamed to
#     .imported, so one world keeps the history and every other world starts clean - which means
#     that for anyone who ran more than one world, the old save no longer applies to all of them.
#     That is old data ceasing to load where it used to, so it is a MAJOR by this project's rule,
#     even though nothing crashes and no file format changed (the JSON is byte-identical in shape).
#   [MINOR] The Charge-and-Slam readout is a drawn HUD gauge instead of an action bar message.
#     New client class SlamChargeHud: a 182px charge bar above the hotbar with quarter ticks, a
#     shaded fill, a full-charge pulse, and a second crimson bar underneath showing the damage
#     bonus itself - which is not the same shape as charge, since the bonus curve is ratio^1.6.
#     Interpolated by partial tick, so it slides rather than stepping 20 times a second. One new
#     clientbound packet, slam_consumed, tells the client the moment the server cashes a charge in
#     so the gauge empties with the hit; it is canSend-guarded, so an older client never sees it.
#     The action bar call, and the block-character bar it drew, are deleted.
#   [PATCH] Restock timing rescaled. RESTOCK_DELAY_SECONDS 300 -> 150 (2m 30s): five minutes was
#     right in principle and too long to actually stand and wait for, and 150 is half of 300 and
#     twice the 75s that 2.9.1 recorded as too short for the iron shortcut to be worth anything.
#     AUTO_RESTOCK_MIN/SPREAD 300/180 -> 150/90 by the same factor, so the open:closed ratio is
#     IDENTICAL to 2.9.2 - worst 1.00:1, average 1.30:1, best 1.60:1 - and only the clock speed
#     changed. The 4-iron shortcut and the buy lock during a refill are untouched.
# 3.0.0 -> 3.0.1 = PATCH. Two bugs in how MANY items a trade hands back. No new feature, no save
# change, no packet change: a 3.0.0 world and a 3.0.0 client both work against this build.
#   [PATCH] Gear came back in stacks. The payout quantity was budget/unitWorth with no reference
#     to whether the item could even stack, so 20 diamonds (1600c, budget 1440) aimed at a diamond
#     sword (165c) returned round(1440/165) = NINE diamond swords in one slot - an item whose
#     vanilla stack limit is 1. The advisor now receives each candidate's real
#     getDefaultMaxStackSize() from the server and refuses to exceed it, so anything unstackable
#     returns exactly 1. ItemFeatures.isWeapon() is a second, independent check on the id itself
#     (_sword, _axe, bow, crossbow, trident, mace) so a weapon stays single even if some pack
#     makes it stackable. handleTrade clamps the built ItemStack a third time before handing it
#     over and logs if it ever has to, because a payout is not the place to trust an upstream
#     number. Measured on a live server against a 66-entry shelf, 18 of them unstackable:
#     diamond sword 9 -> 1, bow 64 -> 1.
#   [PATCH] Bundle size ignored how little the input was worth. Quantity was bounded only by
#     MAX_RETURN_QTY = 64, so value never limited it; aiming a big input at a cheap item just
#     poured the value into count - 40 diamonds at a bow gave 64 bows, 20 diamonds at an arrow
#     gave 64 arrows. Bundles are now bounded by the worth handed in as well:
#     bundleCap = sqrt(inputWorth/4), clamped 1..64. That is 4 items for 64c, 8 for 256c, 20 for
#     1600c, and a full stack only past 16384c - roughly 205 diamonds. The cap is applied per
#     candidate INSIDE the scoring scan rather than to the winner afterwards, so a budget that
#     cannot go wide is pushed up-tier instead of into a pile. Worth the cap trims is not lost; it
#     comes back as coins through the existing change path, so the rate is still 0.9.
#     Arrow 64 -> 20. Worth stating plainly: when the player does NOT force a target, the measured
#     quantities did not move at all (20 diamonds -> 16 iron blocks, 64 oak logs -> 8 amethyst
#     clusters, both identical before and after), because the scorer already weighs value and was
#     landing under the new cap on its own. The forced-target path is what this actually fixes.
#   [PATCH] ShopManager's legacy-save paths moved out of the static initialiser into
#     sharedLegacyFiles(). getConfigDir() needs a live Fabric loader, so holding those two paths in
#     a static final field meant the class could not be loaded outside a launched game - which is
#     what blocked exercising the value model from a harness in the first place. Same paths, same
#     one-time import, resolved when asked for instead of at class load.
# 3.0.1 -> 3.0.2 = PATCH. Asset only, no code changed.
#   [PATCH] assets/merchantmind/icon.png redrawn. Both exchange arcs swept close to 300 degrees, so
#     each one ran underneath the other for most of its length and both arrowheads landed on top of
#     the opposing arc; the neural-node mark sat on the blue arc as well. Nothing in the badge had
#     an angular range of its own. The arcs are now 110 degrees each with a 40-degree gap at the
#     north-west and a 100-degree gap at the south-east, and the node mark lives inside that
#     south-east gap with no arrowhead aimed at it. Coin and star were shrunk (0.255 -> 0.218 and
#     0.155 -> 0.135 of the canvas) and the arcs thickened (0.055 -> 0.070) so the ring still reads
#     at 32px, which is the size Fabric's mod list actually draws. Same 256x256 RGBA, same palette,
#     same background ramp. Generator kept at .bcode/agent-workspace/make_merchantmind_icon.py.
# 3.0.2 -> 3.0.3 = PATCH. Asset only, no code changed. Reverts most of 3.0.2's icon rework.
#   [PATCH] icon.png: 3.0.2 stopped the arcs overlapping by cutting them from ~300 degrees down to
#     110 each, which fixed the overlap but left the badge mostly empty and made the arrows read as
#     small. Wrong trade. The ring is full again: the two arcs tile the whole 360 degrees, 180
#     degrees each, and each arrowhead's TIP lands exactly on the edge of the other arc's round
#     tail cap - measured, not eyeballed, at 39.5px from the cap centre against a cap radius of
#     39.5px at 4x. They touch and never cross, which is what was asked for. The head end of each
#     arc body is drawn without a round cap, because a cap there bulged out past the arrowhead base
#     and made the join lumpy. Arrowheads lengthened (2.15x width, was 1.55x) and slimmed
#     (0.92x half-base, was 1.30x) so they read as arrows rather than blobs.
#   [PATCH] The three-dot neural mark is gone. It was decoration, it never survived the downscale
#     to 32px, and it was one more thing competing for angular space on the ring.
#   [PATCH] Coin restored to the 3.0.1 look. 3.0.2 shrank it (0.255 -> 0.218) and drew it as a
#     smooth 190-step gradient, which came out noticeably darker and more orange than the original.
#     Sampling the 3.0.1 file shows it was never a gradient: three flat bands - pale core
#     ffe8a8, gold band ffce68, shadowed rim c6922e - with the inner bands nudged up and left so
#     the light reads from the upper left. That banding is back, at radius 0.262, and the star is
#     back to 0.163 sitting slightly high in the coin the way the original did.
# 3.0.3 -> 3.0.4 = PATCH. Asset only, no code changed. Icon, third attempt, off the 3.0.1 artwork.
#   [PATCH] Arrowheads were visibly bent. The head was built from the TANGENT at the tip, which
#     puts its base centre sqrt(r^2+L^2)-r pixels off the ring - 36px at this size - so the base
#     never lined up with the end of the arc body. 3.0.3 was that bug shipped. The head is now an
#     isoceles triangle with BOTH tip and base centre on the ring and the base perpendicular to the
#     head's own chord. Perpendicular-to-radius was tried too and still looked rotated against the
#     direction of travel; the chord is what makes it read straight.
#   [PATCH] Arrows and heads enlarged, which is what was asked for: stroke 0.078 -> 0.098 of the
#     canvas, head base 1.70x stroke, head length 2.20x stroke (was 1.55x on a thinner stroke).
#   [PATCH] The round end caps are gone. They read as loose beads sitting on the ring. Both ends of
#     every arc are plain radial cuts now, and the body runs 35% of the way under its own head so
#     the wider head base cannot leave a notch at the join.
#   [PATCH] Arcs still tile 360 degrees exactly - 180 each - and each tip lands on the flat cut of
#     the next arc's tail. Verified by scanning the ring pixel by pixel across both junctions:
#     one clean colour boundary at each, no second boundary, so they touch and never cross.
#   [PATCH] The three-dot mark stays removed, per the earlier request, even though the reference
#     image still had it.
# 3.0.4 -> 3.1.0 = MINOR, on request: the refill duration is no longer one number.
#   [MINOR] How long a category stays shut now depends on WHO started the refill. Every build up to
#     3.0.4 ran one clock, RESTOCK_DELAY_SECONDS = 150, whatever started it. That constant is gone
#     and there are two: AUTO_RESTOCK_DURATION_SECONDS = 60 for the refills the shop starts by
#     itself (the schedule coming due, or the last listing selling out) and
#     MANUAL_RESTOCK_DURATION_SECONDS = 180 for the ones a player starts with the Restock button.
#     This is a MINOR and not a PATCH because it is not a value being corrected - 2.9.1, 2.9.2 and
#     3.0.0 were all PATCH/rescale entries that moved the one number and left the model alone. Here
#     the model itself gains a rule it did not have: the refill duration is now a function of the
#     trigger. Nothing that used to be true of it is true any more, the Help tab has to describe two
#     lengths instead of one, and the shop plays differently in both directions at once - automatic
#     refills are 2.5x shorter, manual ones 1.2x longer. New behaviour, so MINOR, and nothing
#     breaks, so not MAJOR.
#     Making the PLAYER-driven path the slower one is the point, not an oversight. An automatic
#     refill is done TO the player: unasked for, unpredictable, and it locks buying while it runs, so
#     it should be over before it is a nuisance - one minute. A manual refill is a REROLL the player
#     chooses: it throws away the stock on the shelves to draw new stock. A reroll that costs nothing
#     and takes no longer than waiting is a free slot machine, so it is the one that pays three
#     minutes, and the optional 4 iron is the way out. The iron shortcut is untouched and is now
#     worth strictly more, because the refill it cuts short is the long one.
#     One function, restockDurationSeconds(manual), is the only place the choice is made, and
#     beginRestock(), the save clamp in load() and the client's progress bar all call it, so the two
#     numbers cannot end up applied inconsistently. restockDelayLabel() likewise took the flag and
#     lost its no-argument form: since there is no longer "the" refill duration, a caller that does
#     not know which one it means has a bug rather than a default.
#   [MINOR] The client's progress bar is scaled to the duration of the refill it is drawing. It read
#     the single constant before, which is now wrong for one of the two modes: an automatic refill
#     measured against 180 would have started the bar at 67% and filled it before the countdown
#     reached zero. manualRestock was already in the category status row, so the client picks the
#     right total with NO packet change - a 3.0.x client and a 3.1.0 server still speak.
#   AUTO_RESTOCK_MIN/SPREAD deliberately STAY at 150/90, which breaks the invariant those constants
#     document (MIN == refill duration). Holding it would have meant 60/36, i.e. the shop shutting
#     itself every minute, which is the opposite of what a one-minute refill was asked for. The
#     consequence, stated rather than hidden: open 150-240s against 60s closed is open:closed 2.50:1
#     worst / 3.25:1 average / 4.00:1 best, so a category is open ~76% of the time against ~56.5%
#     in 3.0.4. The shop is materially more available. 60/36 is the pair to use if the ratio ever
#     matters more than the availability.
#   Nothing breaks: no save field added, removed or renamed, and no packet touched. A 3.0.x world
#     saved mid-refill is clamped to this build's ceiling for its own mode exactly as it always was,
#     which for an automatic refill means it comes back with at most 60s left instead of 150.
# 3.1.0 -> 3.2.0 = MINOR. A new animation layer, plus the balance numbers that were asked for. The
#   MINOR is bought by the animation work; the two value changes would have been a PATCH alone.
#   [MINOR] New client class ShopFx: a pure, static FX toolkit built out of nothing but fill() and
#     text() - pulse/saw/easeOut/easeInOut/easeOutBack, mix/withAlpha, and the drawing primitives
#     box, border, vGradient, shine, stripes, scanline, ring, burst, orbit, glint, shimmerText,
#     chevronDown and ellipsis. Nothing in it touches the menu, the network or the container, so no
#     effect can desync anything, and every one-shot is driven by one method (age()) that turns a
#     recorded animTicks into "how long ago" - an effect that never fires costs a subtract and a
#     compare, and none can leak into the next screen. The one piece of mutable state is a fixed
#     72-slot particle pool of parallel float arrays, where a dead particle is one with life <= 0 and
#     a new one overwrites the oldest slot, so forty purchases in two seconds allocate exactly as
#     much as none: zero.
#   [MINOR] Animation everywhere in the shop screen, which is what was actually requested. The
#     header gets a shine wash, a shimmering title, a sweeping underline and - new information, not
#     just motion - the coin DELTA floating up out of the readout the way a damage number does, so a
#     purchase says what it cost and not only what is left. The sidebar breathes on the selected tab,
#     washes on hover, and bobs and leans each icon. Catalog rows carry a per-row phase-offset idle
#     wash, gold hover edges, a bobbing item and a shimmering price. The restock panel gains a
#     gradient plate, a scanline, embers, two counter-rotating orbit rings, a per-second scale-pop
#     with a burst, and a rebuilt 7px progress bar with scrolling stripes, a leading bead and a glow.
#     The primary button's halo gains a light that runs its perimeter only while it is ENABLED, which
#     is the state players kept misreading. Trade animates its arrow, rings and bobs an approved
#     result, and sparkles it; both AI tabs now cycle real dots while thinking, so a slow server
#     looks busy instead of stuck. The empty panel turns its glyph and, while WAITING for the first
#     sync, orbits and animates its dots, so "loading" and "sold out" stop looking identical.
#   [MINOR] Two effects exist to answer questions the UI previously left unanswered. A finished
#     refill is now loud - white wash, three shockwaves, a spark spray and READY! overshooting -
#     because a refill is a minute the player spends looking somewhere else, so its tail has to
#     still be on screen when they look back. It is detected client-side by watching the server's own
#     restocking flag go false, paired with the tab it belonged to so switching tabs cannot fire it:
#     no new packet, no client-side guess. And a click on a dead slot, which slotClicked has always
#     silently swallowed, finally ripples - in the denied colour, so "you missed" and "nothing has
#     happened yet" stop looking like a frozen game.
#   [PATCH] RESTOCK_IRON_COST 4 -> 2, as asked. One constant, and nothing anywhere hardcoded 4, so
#     chat lines, the Help tab and the slot check all followed it; two stale comments that said "4
#     iron" were corrected to name the constant.
#   [PATCH] The automatic cycle is a flat one minute: AUTO_RESTOCK_MIN_SECONDS 150 -> 60 and
#     AUTO_RESTOCK_SPREAD_SECONDS 90 -> 0. Against the unchanged 60s automatic refill that is
#     open:closed 1.00:1 - exactly 50% of the cycle buyable, against ~76.5% in 3.1.0 and ~56.5% in
#     3.0.4 - so the shop is materially LESS available than 3.1.0. Stated plainly because it is the
#     direct consequence of asking for a one-minute cycle, not a side effect.
#     Dropping the spread to 0 removes the only thing that kept five categories from refilling in
#     lockstep after opening on the same tick, so the scatter moved to where it is actually needed:
#     new rollFirstAutoInterval() draws 1..60 for a category's FIRST cycle only. A fixed interval
#     preserves phase offsets forever but creates none, so one random partial cycle at the start is
#     enough, and it is applied in the three places a category can acquire a schedule - openWorld
#     (only when it has none of its own), the tickOncePerSecond idle guard, and load() when the field
#     is missing from an older save.
#   MANUAL_RESTOCK_DURATION_SECONDS is deliberately UNCHANGED at 180. "restock 1 minute" was read as
#     the automatic cycle, since that is the clock the 1m/1m pair describes; if the manual refill was
#     meant to be one minute too, that is a one-constant change and has not been made.
#   Nothing breaks: no save field added, removed or renamed, no packet touched, and no new
#     client/server contract - a 3.0.x/3.1.0 client and this server still speak. A 3.1.0 world
#     carrying a nextAutoRestockSeconds from the old 150-240 range finishes that longer cycle once
#     and then re-rolls into the flat 60.
# 3.2.0 -> 3.3.0 = MINOR, on request: "open the shop 2 minutes, auto restock 30s, and if it is
#   pressed manually or the stock runs out, restock 1 minute". Three numbers were asked for; the
#   third one is not a number, and it is what makes this a MINOR rather than a PATCH.
#   [MINOR] WHICH clock a refill runs is now decided by the trigger, and SOLD_OUT CHANGED SIDES.
#     3.1.0 introduced two durations and picked between them with one boolean, "did a player press
#     Restock", which filed a sold-out shelf with the shop's own schedule - the comment on
#     restockDurationSeconds said so outright: "SOLD_OUT counts as automatic, because no player asked
#     for it". This release rejects that grouping. A shelf that empties was emptied BY the players, so
#     it is demand, and demand is what the long clock is for: MANUAL and SOLD_OUT now share
#     TRIGGERED_RESTOCK_DURATION_SECONDS = 60 while only the schedule gets
#     SCHEDULED_RESTOCK_DURATION_SECONDS = 30. That is a rule the model did not have - a sold-out
#     refill is timed differently from a scheduled one for the first time, and it is the requested
#     "manual or sold out -> 1 minute" - so MINOR, not PATCH, by the same reasoning that made 3.1.0 a
#     MINOR when the duration first became a function of the trigger.
#     The selector moved with the rule. restockDurationSeconds(boolean) and restockDelayLabel(boolean)
#     are gone; both take a RestockReason, and the answer lives on the enum as RestockReason.triggered,
#     so the three places that have to agree about a refill's length - the server's countdown, the save
#     clamp and the client's progress bar - all read one field. beginRestock() no longer takes a
#     manual flag beside the reason (it derived from it, so it could contradict it), and RestockEvent
#     carries the reason instead of a boolean, which is also how a finish event now knows which clock
#     it just ended.
#   [MINOR] The two old constants are renamed, not just retimed: AUTO_/MANUAL_RESTOCK_DURATION_SECONDS
#     -> SCHEDULED_/TRIGGERED_RESTOCK_DURATION_SECONDS. "MANUAL" was the wrong name for a duration two
#     different triggers use, and "AUTO" was the wrong name for one that a sold-out shelf - which is
#     automatic in every ordinary sense - does not get.
#   [PATCH] The numbers themselves. AUTO_RESTOCK_MIN_SECONDS 60 -> 120 (the requested 2 minutes open),
#     scheduled refill 60 -> 30, and the player/sold-out refill 180 -> 60. SPREAD stays 0 and
#     rollFirstAutoInterval() reads MIN, so the first-cycle scatter is now 1..120 with no edit.
#     Availability, when nobody touches a category: open 120s against a 30s refill is open:closed
#     4.00:1, i.e. exactly 80% of the cycle buyable, against 50% in 3.2.0 and ~76.5% in 3.1.0. The
#     full cycle is 150s, so a category also turns over more often than in any build since 2.9.x.
#     A reroll is now 60s rather than 180s, so pressing Restock is much cheaper than it was - it is
#     still twice a scheduled refill, and the 2-iron shortcut still ends either one instantly.
#   [PATCH] Client display follows the trigger rather than the boolean. The progress bar is scaled by
#     the reason (a sold-out refill drawn against the schedule's 30s would have hit 100% at its
#     halfway point), the header says "sold-out restock" as a third case instead of calling it an
#     "auto restock" while timing it as a manual one, and the Help tab describes three triggers on two
#     clocks in the same seven lines it had.
#   The sync row now carries RestockReason.name() where it carried the display sentence, so the client
#     can ask for the trigger instead of matching on text. Same field, same type, same row shape: no
#     new packet, and the client turns the key back into the identical sentence via
#     RestockReason.fromKey().display.
#   Nothing breaks: no save field added, removed or renamed. A 3.2.0 world mid-refill is clamped to
#     this build's ceiling for its own trigger exactly as every build has done - a manual refill comes
#     back with at most 60s left instead of 180, a scheduled one at most 30 instead of 60 - and the
#     clamp falls back to the manualRestock flag, then to SCHEDULED, for saves too old to record a
#     reason. A save carrying a nextAutoRestockSeconds from the old flat 60 finishes that shorter
#     cycle once and re-rolls into 120.
#   [PATCH] assets/merchantmind/icon.png replaced with the supplied artwork (see README).
# 3.3.0 -> 3.3.1 = PATCH. One deletion, client-only, on request: the mod no longer puts a button on
#   the pause screen.
#   [PATCH] MerchantMindClient's ScreenEvents.AFTER_INIT hook is gone, and with it the whole notion of
#     this mod editing a screen it does not own. It added a 204x20 "✦ Open Merchant Shop" button into
#     PauseScreen's widget list at hard-coded coordinates (centred, 30px off the bottom) via
#     Screens.getWidgets().add(). Because it reserved no space in the pause screen's layout it pushed
#     nothing aside - it was drawn OVER whatever occupied that strip, so another mod's button there was
#     hidden underneath it, and since click dispatch walks the widget list and stops at the first
#     widget reporting a hit, being in the list at all let it swallow the click meant for the button it
#     covered. Another mod's feature vanishing because this one is installed is a defect, not a
#     feature, which is why this is a PATCH.
#     Why not MINOR: nothing was added. Why not MAJOR: nothing that used to work stops working. The
#     keybind (default B, rebindable, unbindable) sends the same OpenShopC2SPayload it always did and
#     is now the single way in; the packet, the server handler, ShopScreen, the save format and every
#     restock clock are byte-for-byte the release before it. The four imports that only that block used
#     (ScreenEvents, Screens, Button, PauseScreen) are dropped with it.
#     A comment in their place records why there is no such button, so it does not get re-added: if a
#     menu entry is ever wanted again it has to go through a layout API that reserves its own row.
mod_version=3.3.1+mc26.1.2
maven_group=com.merchantmind
archives_base_name=merchantmind

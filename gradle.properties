org.gradle.parallel=true

minecraft_version=26.1.2
loader_version=0.19.3
fabric_version=0.155.2+26.1.2

# Scheme: SemVer (MAJOR.MINOR.PATCH) + "+mc<minecraft>" build metadata.
# 2.3.1 -> 2.3.2 = bugfix/hardening only, no new features, no breaking change.
# 2.5.1 -> 2.6.0 = MINOR: automatic restock is a new feature (the scheduled timer now performs the
#   restock itself, free, instead of only raising a hint), and live restock countdowns are new.
#   The bug fixes shipped with it - the "Ready." strip covering the Trade/Sell tabs, and Buy
#   staying live during a restock - would only have been a PATCH on their own, but a new feature
#   outranks a bug fix. Nothing breaks: old shop saves load unchanged.
# 2.6.0 -> 2.7.0 = MINOR. Three new features: a manual restock now starts immediately and the
#   4 iron became an optional "finish it now" shortcut instead of a requirement; the central item
#   area is replaced by a large live countdown while a category refills; and all shop state is
#   broadcast, so a restock one player triggers is visible to everyone with the shop open. The
#   animation performance work is an optimisation, not a feature, and would have been a PATCH on
#   its own - but a feature outranks it. Nothing breaks: 2.5.x/2.6.x shop saves load unchanged
#   (the retired armed/due flags are ignored on load).
# 2.7.0 -> 2.8.0 = MINOR. One new feature: with "Cinematic Respawn" (mod id cinematic_respawn,
#   client-only) installed, death switches the camera to third person back and the first movement
#   after respawning restores the player's own view. Auto-detected, no setting, and completely
#   absent when that mod is not installed. Shipped alongside it is the real fix for the frame drop
#   when the shop menu opens - the 15 GUI textures are now warmed a tick at a time instead of being
#   read, decoded and uploaded inside the frame that opens the screen - which would have been a
#   PATCH on its own. Nothing breaks: saves and packets are unchanged from 2.7.0.
# 2.8.0 -> 2.9.0 = MINOR. The GUI textures are now loaded by the shop screen itself, in one pass,
#   in init() - the 15-tick background warm-up added in 2.8.0 is deleted outright, along with the
#   crash window it opened when the menu was opened while it was still running. That much is a
#   PATCH; the reason this is a MINOR is the balance pass shipped with it, which changes how the
#   mod plays: Charge-and-Slam now takes 38 ticks (1.9s) to reach full power instead of 30 (1.5s),
#   and a restock takes 75 seconds instead of 45 when the optional 4 iron is not paid, so the iron
#   shortcut is worth something again. Memory work rides along - EnumMap/array-backed shop tables,
#   an allocation-free restock roll, and one shared sync row list per state change instead of one
#   per player per second - which would have been a PATCH on its own.
#   Nothing breaks: 2.7.x/2.8.x saves and packets load unchanged. A save mid-restock is clamped to
#   the new 75s ceiling exactly as it always was.
# 2.9.0 -> 2.9.1 = PATCH. Restock duration only: 75 -> 300 seconds (5 minutes) when the optional
#   4 iron is not paid. 2.9.0's 75s was still short enough that waiting was never worse than paying,
#   which made the iron shortcut - and therefore the whole restock mechanic - pointless; buying is
#   locked for the entire refill, so "no iron" now genuinely means that category is shut for five
#   real minutes. This is a corrected value, not a new feature: no new behaviour, no new packet, no
#   new state, and the only other edit is the wording that reads it ("5m" instead of "300s" in chat
#   and in the Help tab). Everything else in 2.9.0 - the GUI preload, the 38-tick slam, the memory
#   work - is untouched. Nothing breaks: 2.7.x-2.9.0 saves load unchanged, and a save caught
#   mid-restock is clamped to the new ceiling exactly as it always was.
# 2.9.1 -> 2.9.2 = PATCH. Balance follow-up to 2.9.1, values only. 2.9.1 raised the refill to 300s
#   but left the automatic schedule at its old 120-300s, so an unfed category was CLOSED longer than
#   it was open - open:closed ran 0.40:1 to 1.00:1, averaging 0.70:1, i.e. only ~41% of the cycle
#   buyable. AUTO_RESTOCK_MIN_SECONDS 120 -> 300 (SPREAD stays 180, so categories still drift apart)
#   makes the open stretch 300-480s against the same 300s refill: open:closed 1.00:1 worst,
#   1.30:1 average, 1.60:1 best - open is never the shorter half again. RESTOCK_DELAY_SECONDS is
#   deliberately untouched at 300, and the optional 4-iron shortcut is untouched. No new feature, no
#   new packet, no new state, no new field: the Help tab already builds its "AUTO - every X-Ymin"
#   line from these two constants and now reads 5-8min by itself. Nothing breaks: 2.7.x-2.9.1 saves
#   load unchanged, and a save carrying a nextAutoRestockSeconds from the old 120-300 range simply
#   finishes that shorter cycle once and re-rolls into the new range.
# 2.9.2 -> 3.0.0 = MAJOR, and the MAJOR is bought by exactly one of the three changes below.
#   [MAJOR] The shop save MOVED. It was config/merchantmind_shop.json - one file belonging to the
#     game installation, which every world in that installation opened, wrote to and overwrote, so
#     stock, prices, both restock clocks and every player's coin balance were shared across worlds
#     and deleting one world corrupted the rest. It is now <save>/data/merchantmind_shop.json:
#     per-world, and copied/renamed/deleted with the world like the world data it always was. The
#     old shared file is adopted by the FIRST world opened after the update and then renamed to
#     .imported, so one world keeps the history and every other world starts clean - which means
#     that for anyone who ran more than one world, the old save no longer applies to all of them.
#     That is old data ceasing to load where it used to, so it is a MAJOR by this project's rule,
#     even though nothing crashes and no file format changed (the JSON is byte-identical in shape).
#   [MINOR] The Charge-and-Slam readout is a drawn HUD gauge instead of an action bar message.
#     New client class SlamChargeHud: a 182px charge bar above the hotbar with quarter ticks, a
#     shaded fill, a full-charge pulse, and a second crimson bar underneath showing the damage
#     bonus itself - which is not the same shape as charge, since the bonus curve is ratio^1.6.
#     Interpolated by partial tick, so it slides rather than stepping 20 times a second. One new
#     clientbound packet, slam_consumed, tells the client the moment the server cashes a charge in
#     so the gauge empties with the hit; it is canSend-guarded, so an older client never sees it.
#     The action bar call, and the block-character bar it drew, are deleted.
#   [PATCH] Restock timing rescaled. RESTOCK_DELAY_SECONDS 300 -> 150 (2m 30s): five minutes was
#     right in principle and too long to actually stand and wait for, and 150 is half of 300 and
#     twice the 75s that 2.9.1 recorded as too short for the iron shortcut to be worth anything.
#     AUTO_RESTOCK_MIN/SPREAD 300/180 -> 150/90 by the same factor, so the open:closed ratio is
#     IDENTICAL to 2.9.2 - worst 1.00:1, average 1.30:1, best 1.60:1 - and only the clock speed
#     changed. The 4-iron shortcut and the buy lock during a refill are untouched.
# 3.0.0 -> 3.0.1 = PATCH. Two bugs in how MANY items a trade hands back. No new feature, no save
# change, no packet change: a 3.0.0 world and a 3.0.0 client both work against this build.
#   [PATCH] Gear came back in stacks. The payout quantity was budget/unitWorth with no reference
#     to whether the item could even stack, so 20 diamonds (1600c, budget 1440) aimed at a diamond
#     sword (165c) returned round(1440/165) = NINE diamond swords in one slot - an item whose
#     vanilla stack limit is 1. The advisor now receives each candidate's real
#     getDefaultMaxStackSize() from the server and refuses to exceed it, so anything unstackable
#     returns exactly 1. ItemFeatures.isWeapon() is a second, independent check on the id itself
#     (_sword, _axe, bow, crossbow, trident, mace) so a weapon stays single even if some pack
#     makes it stackable. handleTrade clamps the built ItemStack a third time before handing it
#     over and logs if it ever has to, because a payout is not the place to trust an upstream
#     number. Measured on a live server against a 66-entry shelf, 18 of them unstackable:
#     diamond sword 9 -> 1, bow 64 -> 1.
#   [PATCH] Bundle size ignored how little the input was worth. Quantity was bounded only by
#     MAX_RETURN_QTY = 64, so value never limited it; aiming a big input at a cheap item just
#     poured the value into count - 40 diamonds at a bow gave 64 bows, 20 diamonds at an arrow
#     gave 64 arrows. Bundles are now bounded by the worth handed in as well:
#     bundleCap = sqrt(inputWorth/4), clamped 1..64. That is 4 items for 64c, 8 for 256c, 20 for
#     1600c, and a full stack only past 16384c - roughly 205 diamonds. The cap is applied per
#     candidate INSIDE the scoring scan rather than to the winner afterwards, so a budget that
#     cannot go wide is pushed up-tier instead of into a pile. Worth the cap trims is not lost; it
#     comes back as coins through the existing change path, so the rate is still 0.9.
#     Arrow 64 -> 20. Worth stating plainly: when the player does NOT force a target, the measured
#     quantities did not move at all (20 diamonds -> 16 iron blocks, 64 oak logs -> 8 amethyst
#     clusters, both identical before and after), because the scorer already weighs value and was
#     landing under the new cap on its own. The forced-target path is what this actually fixes.
#   [PATCH] ShopManager's legacy-save paths moved out of the static initialiser into
#     sharedLegacyFiles(). getConfigDir() needs a live Fabric loader, so holding those two paths in
#     a static final field meant the class could not be loaded outside a launched game - which is
#     what blocked exercising the value model from a harness in the first place. Same paths, same
#     one-time import, resolved when asked for instead of at class load.
# 3.0.1 -> 3.0.2 = PATCH. Asset only, no code changed.
#   [PATCH] assets/merchantmind/icon.png redrawn. Both exchange arcs swept close to 300 degrees, so
#     each one ran underneath the other for most of its length and both arrowheads landed on top of
#     the opposing arc; the neural-node mark sat on the blue arc as well. Nothing in the badge had
#     an angular range of its own. The arcs are now 110 degrees each with a 40-degree gap at the
#     north-west and a 100-degree gap at the south-east, and the node mark lives inside that
#     south-east gap with no arrowhead aimed at it. Coin and star were shrunk (0.255 -> 0.218 and
#     0.155 -> 0.135 of the canvas) and the arcs thickened (0.055 -> 0.070) so the ring still reads
#     at 32px, which is the size Fabric's mod list actually draws. Same 256x256 RGBA, same palette,
#     same background ramp. Generator kept at .bcode/agent-workspace/make_merchantmind_icon.py.
# 3.0.2 -> 3.0.3 = PATCH. Asset only, no code changed. Reverts most of 3.0.2's icon rework.
#   [PATCH] icon.png: 3.0.2 stopped the arcs overlapping by cutting them from ~300 degrees down to
#     110 each, which fixed the overlap but left the badge mostly empty and made the arrows read as
#     small. Wrong trade. The ring is full again: the two arcs tile the whole 360 degrees, 180
#     degrees each, and each arrowhead's TIP lands exactly on the edge of the other arc's round
#     tail cap - measured, not eyeballed, at 39.5px from the cap centre against a cap radius of
#     39.5px at 4x. They touch and never cross, which is what was asked for. The head end of each
#     arc body is drawn without a round cap, because a cap there bulged out past the arrowhead base
#     and made the join lumpy. Arrowheads lengthened (2.15x width, was 1.55x) and slimmed
#     (0.92x half-base, was 1.30x) so they read as arrows rather than blobs.
#   [PATCH] The three-dot neural mark is gone. It was decoration, it never survived the downscale
#     to 32px, and it was one more thing competing for angular space on the ring.
#   [PATCH] Coin restored to the 3.0.1 look. 3.0.2 shrank it (0.255 -> 0.218) and drew it as a
#     smooth 190-step gradient, which came out noticeably darker and more orange than the original.
#     Sampling the 3.0.1 file shows it was never a gradient: three flat bands - pale core
#     ffe8a8, gold band ffce68, shadowed rim c6922e - with the inner bands nudged up and left so
#     the light reads from the upper left. That banding is back, at radius 0.262, and the star is
#     back to 0.163 sitting slightly high in the coin the way the original did.
# 3.0.3 -> 3.0.4 = PATCH. Asset only, no code changed. Icon, third attempt, off the 3.0.1 artwork.
#   [PATCH] Arrowheads were visibly bent. The head was built from the TANGENT at the tip, which
#     puts its base centre sqrt(r^2+L^2)-r pixels off the ring - 36px at this size - so the base
#     never lined up with the end of the arc body. 3.0.3 was that bug shipped. The head is now an
#     isoceles triangle with BOTH tip and base centre on the ring and the base perpendicular to the
#     head's own chord. Perpendicular-to-radius was tried too and still looked rotated against the
#     direction of travel; the chord is what makes it read straight.
#   [PATCH] Arrows and heads enlarged, which is what was asked for: stroke 0.078 -> 0.098 of the
#     canvas, head base 1.70x stroke, head length 2.20x stroke (was 1.55x on a thinner stroke).
#   [PATCH] The round end caps are gone. They read as loose beads sitting on the ring. Both ends of
#     every arc are plain radial cuts now, and the body runs 35% of the way under its own head so
#     the wider head base cannot leave a notch at the join.
#   [PATCH] Arcs still tile 360 degrees exactly - 180 each - and each tip lands on the flat cut of
#     the next arc's tail. Verified by scanning the ring pixel by pixel across both junctions:
#     one clean colour boundary at each, no second boundary, so they touch and never cross.
#   [PATCH] The three-dot mark stays removed, per the earlier request, even though the reference
#     image still had it.
mod_version=3.0.4+mc26.1.2
maven_group=com.merchantmind
archives_base_name=merchantmind
